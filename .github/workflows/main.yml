name: Build Steam Shutdown APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: steam-shutdown-app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify project files
        shell: bash
        run: |
          set -e
          echo "Current directory:"
          pwd
          echo "Listing files:"
          ls -la
          test -f "settings.gradle.kts" || (echo "settings.gradle.kts not found!" && exit 1)
          test -f "build.gradle.kts" || (echo "build.gradle.kts not found!" && exit 1)
          test -f "app/build.gradle.kts" || (echo "app/build.gradle.kts not found!" && exit 1)
          test -f "app/src/main/AndroidManifest.xml" || (echo "AndroidManifest.xml not found!" && exit 1)

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-shutdown-debug-apk
          path: steam-shutdown-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
